<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NimbusFlow - Software de Automatización</title>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-54GJ3CL4');</script>
  <!-- End Google Tag Manager -->
</head>

<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px;">

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-54GJ3CL4"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main>
    <h2>NimbusFlow - Soluciones Cloud B2B</h2>
    <p>Automatización inteligente de flujos de trabajo empresariales.</p>

    <hr style="margin: 20px 0;" />

    <section>
      <h3>Solicitar Demo o Iniciar Trial</h3>
      
      <label for="tier">Plan de interés:</label><br />
      <select id="tier" style="margin-bottom: 10px; padding: 6px;">
        <option value="suscripcion_mensual">Plan Mensual</option>
        <option value="suscripcion_anual">Plan Anual</option>
      </select>
      <br />

      <label for="company_size">Tamaño de empresa:</label><br />
      <select id="company_size" style="margin-bottom: 15px; padding: 6px;">
        <option value="11-50">11 a 50 empleados</option>
        <option value="51-200">51 a 200 empleados</option>
        <option value="200+">Más de 200 empleados</option>
      </select>
      <br />

      <!-- Botón 1: Lead inicial (generate_lead) -->
      <button type="button" onclick="dispararLead()" style="padding: 10px 16px; margin-right: 10px;">
        Registrar interés (Lead B2B)
      </button>

      <!-- Botón 2: Compra confirmada (purchase) -->
      <button type="button" onclick="dispararCompra()" style="padding: 10px 16px; background-color: #0066cc; color: white; border: none; border-radius: 4px;">
        Comprar Plan (Conversión Final)
      </button>
    </section>
  </main>

  <script>
    // Evento 1: Lead B2B (generate_lead)
    function dispararLead() {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'generate_lead',
        'origen_trafico': 'paid_google',
        'currency': 'USD',
        'value': 180.00 // Valor proyectado matemático que justificaste
      });

      alert('Evento "generate_lead" enviado al Data Layer con valor USD 180.');
    }

    // Evento 2: Compra (purchase)
    function dispararCompra() {
      var tierSeleccionado = document.getElementById('tier').value;
      var uniqueEventId = 'NF-2026-' + Date.now(); // Simulamos el transaction_id

      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'purchase',
        'tipo_usuario': 'premium',
        'categoria_producto': tierSeleccionado,
        'currency': 'USD',
        'value': 1200.00, // Valor exacto exigido en la tarea
        'transaction_id': uniqueEventId
      });

      alert('Evento "purchase" enviado al Data Layer con valor USD 1200.');
    }
  </script>

</body>
</html>
